name: Darwin platform validation

on:
  push:
    branches:
    - ci/darwin-x86_64-validation

permissions:
  contents: read

jobs:
  validate:
    name: macOS ${{ matrix.name }} build
    strategy:
      fail-fast: false
      matrix:
        include:
        - name: ARM64
          runner: macos-15
          expected_uname: arm64
          platform: //bazel/platforms:macos_arm64
          expected_protoc: '@prebuilt_protoc.osx_aarch_64//:bin/protoc'
          quarantine_homebrew_openssl: false
        - name: x86_64
          runner: macos-15-intel
          expected_uname: x86_64
          platform: //bazel/platforms:macos_x86_64
          expected_protoc: '@prebuilt_protoc.osx_x86_64//:bin/protoc'
          quarantine_homebrew_openssl: true
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    env:
      BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
    steps:
    - name: Check out draft SHA
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
    - name: Validate selectors and compile Darwin targets
      shell: bash
      run: |
        set -euo pipefail
        source ./ci/mac_ci_setup.sh

        test "$(uname -m)" = "${{ matrix.expected_uname }}"
        uname -a

        # The hosted Intel image places Homebrew OpenSSL ahead of declared Bazel headers.
        if [[ "${{ matrix.quarantine_homebrew_openssl }}" == "true" && \
              -d /usr/local/include/openssl ]]; then
          sudo mv /usr/local/include/openssl /usr/local/include/openssl.envoy-validation-backup
        fi

        build_config="$(pwd)/ci/osx-build-config"
        common_options=(
          --curses=no
          --verbose_failures
          "--override_repository=envoy_build_config=${build_config}"
          --remote_cache=grpcs://remote.buildbuddy.io
          "--remote_header=x-buildbuddy-api-key=${BUILDBUDDY_API_KEY}"
          --remote_cache_compression
          --remote_timeout=120
          --remote_upload_local_results
          # Prefer Envoy's BoringSSL headers over Homebrew OpenSSL on the hosted Intel image.
          --copt=-Iexternal/boringssl/include
        )
        platform_options=(
          "${common_options[@]}"
          "--platforms=${{ matrix.platform }}"
        )

        selected_protoc="$({
          bazel cquery "${platform_options[@]}" \
            //tools/protoc:protoc \
            --output=build
        })"
        grep -F '${{ matrix.expected_protoc }}' <<< "${selected_protoc}"

        selected_protoc_with_cpu="$({
          bazel cquery "${platform_options[@]}" \
            --cpu=k8 \
            //tools/protoc:protoc \
            --output=build
        })"
        grep -F '${{ matrix.expected_protoc }}' <<< "${selected_protoc_with_cpu}"

        bazel build "${platform_options[@]}" \
          //tools/protoc:protoc \
          //source/extensions/network/dns_resolver/apple:config \
          //source/extensions/geoip_providers/maxmind:config

        bazel build "${platform_options[@]}" \
          --cpu=k8 \
          //tools/protoc:protoc \
          //source/extensions/network/dns_resolver/apple:config \
          //source/extensions/geoip_providers/maxmind:config

        # Homebrew Core builds Envoy with --config=macos and no explicit target platform.
        homebrew_options=(
          "${common_options[@]}"
          --config=macos
        )

        selected_protoc_homebrew="$({
          bazel cquery "${homebrew_options[@]}" \
            //tools/protoc:protoc \
            --output=build
        })"
        grep -F '${{ matrix.expected_protoc }}' <<< "${selected_protoc_homebrew}"

        bazel build "${homebrew_options[@]}" \
          //tools/protoc:protoc \
          //source/extensions/network/dns_resolver/apple:config \
          //source/extensions/geoip_providers/maxmind:config

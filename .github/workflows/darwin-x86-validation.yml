name: Darwin x86_64 validation

on:
  push:
    branches:
    - ci/darwin-x86_64-validation

permissions:
  contents: read

jobs:
  validate:
    name: macOS Intel build
    runs-on: macos-15-intel
    timeout-minutes: 120
    steps:
    - name: Check out draft SHA
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
    - name: Validate selectors and compile x86_64 targets
      shell: bash
      run: |
        set -euo pipefail
        source ./ci/mac_ci_setup.sh

        test "$(uname -m)" = "x86_64"
        uname -a

        build_config="$(pwd)/ci/osx-build-config"
        common_options=(
          --curses=no
          --verbose_failures
          "--override_repository=envoy_build_config=${build_config}"
          --platforms=//bazel/platforms:macos_x86_64
        )

        selected_protoc="$({
          bazel cquery "${common_options[@]}" \
            //tools/protoc:protoc \
            --output=build
        })"
        grep -F '@prebuilt_protoc.osx_x86_64//:bin/protoc' <<< "${selected_protoc}"

        selected_protoc_with_cpu="$({
          bazel cquery "${common_options[@]}" \
            --cpu=k8 \
            //tools/protoc:protoc \
            --output=build
        })"
        grep -F '@prebuilt_protoc.osx_x86_64//:bin/protoc' <<< "${selected_protoc_with_cpu}"

        bazel build "${common_options[@]}" \
          //tools/protoc:protoc \
          //source/extensions/network/dns_resolver/apple:config \
          //source/extensions/geoip_providers/maxmind:config

        bazel build "${common_options[@]}" \
          --cpu=k8 \
          //tools/protoc:protoc \
          //source/extensions/network/dns_resolver/apple:config \
          //source/extensions/geoip_providers/maxmind:config
